name: Bug
description: The engine throws, breaks a page, or an API does not do what the docs say.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: 'Expected vs actual, with the error if any.' }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Minimal reproduction, render: ts }
  - type: input
    id: env
    attributes: { label: Version and environment, placeholder: '@doubleagent-so/agent-detector 0.1.0, Chrome 141, Vite 8' }
